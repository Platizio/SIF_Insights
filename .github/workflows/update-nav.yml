name: Update SIF NAV

# The 24h scheduler. AMCs update SIF NAV on the AMFI Latest NAV portal by
# 23:00 IST on every business day, so this runs at 23:30 IST — after the filing
# window closes, while still inside the same IST day. Anything earlier risks
# picking up the previous business day's values.
#
# It appends the day's observation to each scheme's series and commits, which
# triggers the host to rebuild and redeploy.
#
# If the source format drifts or one of the 33 scheme codes stops resolving,
# fetch_nav.py exits non-zero and this job FAILS (GitHub emails the repo owner)
# rather than committing bad or partial data.

on:
  schedule:
    - cron: '0 18 * * 1-5'    # 18:00 UTC = 23:30 IST, Mon–Fri
  workflow_dispatch: {}        # manual "Run workflow" button

permissions:
  contents: write              # so the job can push the data commit

concurrency:
  group: update-nav
  cancel-in-progress: false

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch latest NAV (validates all 33 codes, else fails)
        run: python pipeline/fetch_nav.py

      # The app imports lib/data/raw/*.json, so a data change must be type-safe
      # before it is committed — a malformed series would otherwise only surface
      # at the next deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and typecheck
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit & push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/nav-history.json lib/data/raw/nav-history.json lib/data/raw/schemes.json
          if git diff --staged --quiet; then
            echo "No NAV changes today — nothing to commit."
          else
            # NO `[skip ci]` IN THIS MESSAGE. The host treats that token as
            # "do not deploy", so it was suppressing the very redeploy this
            # job exists to trigger — the data landed in git and never
            # reached the site. There is also nothing for it to skip: CI
            # excludes this path rather than relying on a commit token.
            git commit -m "chore(nav): daily SIF NAV update"
            # AMFI's feed is a latest-snapshot file, so a rejected push does
            # not retry — that business day's observation is lost for good.
            # Rebase onto anything a human pushed since checkout.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
